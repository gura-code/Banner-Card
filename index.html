<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YouTube Profile Maker</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-text-size-adjust: 100%; }
    html, body { width: 100vw; height: 100dvh; overflow: hidden; background-color: #ffffff; color: #000000; font-family: 'Quicksand', sans-serif; display: flex; justify-content: center; align-items: center; }
    .phone-wrapper { width: 100vw; height: 100dvh; background-color: #ffffff; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    @media (min-width: 500px) { .phone-wrapper { width: 380px; height: 820px; border-radius: 40px; border: 8px solid #000000; box-shadow: 0 20px 40px rgba(0,0,0,0.3); } }

    /* UI PRINCIPALE */
    .main-ui { display: flex; width: 100%; height: 100%; flex-direction: column; padding: 16px; justify-content: space-between; align-items: center; background-color: #ffffff; overflow-y: auto; }
    
    .profile-card { width: 320px; background-color: #ffffff; border: 3px solid #000000; border-radius: 24px; padding: 12px; display: flex; flex-direction: column; position: relative; margin-top: 20px; }
    
    /* BANNER AGGIORNATO */
    .banner-box { width: 100%; height: 100px; border: 2px solid #000000; border-radius: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; transition: background-color 0.3s ease; }
    .banner-box img { width: 100%; height: 100%; object-fit: cover; display: none; position: relative; z-index: 2; }
    .banner-placeholder { font-size: 12px; font-weight: 800; color: #666666; z-index: 1; }

    .avatar-wrapper { width: 100%; height: 40px; position: relative; margin-bottom: 8px; }
    .avatar-box { width: 75px; height: 75px; border: 3px solid #000000; border-radius: 50%; cursor: pointer; background-color: #ffffff; display: flex; align-items: center; justify-content: center; position: absolute; top: -38px; z-index: 5; }
    .avatar-box.pos-left { left: 10px; }
    .avatar-box.pos-center { left: 50%; transform: translateX(-50%); }
    .avatar-box.pos-right { right: 10px; left: auto; }
    .avatar-box img { width: 100%; height: 100%; object-fit: cover; display: none; border-radius: 50%; }
    .avatar-placeholder { font-size: 10px; font-weight: 800; color: #666666; }

    .profile-info-box { display: flex; flex-direction: column; gap: 6px; }
    .profile-info-box.align-left { text-align: left; }
    .profile-info-box.align-center { text-align: center; }
    .profile-info-box.align-right { text-align: right; }
    .editable { outline: none; border-radius: 8px; padding: 2px 4px; min-height: 18px; }
    .editable.placeholder-active { opacity: 0.6; }
    .profile-name { font-size: 18px; font-weight: 800; }
    .profile-tag { font-size: 13px; font-weight: 700; opacity: 0.8; }
    .profile-bio { font-size: 11px; font-weight: 600; }

    /* MENU SUB-OPTIONS */
    .color-sub-menu { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #111111; padding: 10px; border-radius: 20px; width: 100%; max-width: 320px; }
    .menu-btn { background: #222222; color: #ffffff; border: 1px solid #333333; padding: 8px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-download { width: 100%; background-color: #000000; color: #ffffff; padding: 14px; border-radius: 16px; font-weight: 800; text-align: center; margin-top: 10px; cursor: pointer; }

    /* MODALE COLORE */
    .picker-modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 200; display: none; justify-content: center; align-items: flex-end; padding-bottom: 20px; }
    .picker-container { width: 340px; background: #1c1c1e; border-radius: 28px; padding: 16px; color: #ffffff; }
    .grid-view { display: grid; grid-template-columns: repeat(13, 1fr); gap: 2px; height: 220px; }
    .grid-cell { border-radius: 2px; cursor: pointer; }
    .btn-action { cursor: pointer; padding: 10px; text-align: center; font-weight: 800; }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div class="main-ui" id="main-ui">
      <div style="font-weight:800; margin-top:10px;">Create Profile</div>
      
      <div class="profile-card" id="main-card">
        <!-- Banner con colore dinamico -->
        <div class="banner-box" id="banner-box" onclick="document.getElementById('banner-input').click()">
          <img id="banner-img" src="" alt="banner">
          <div id="banner-placeholder" class="banner-placeholder">+ Add Banner Photo</div>
        </div>

        <div class="avatar-wrapper">
          <div class="avatar-box pos-left" id="avatar-box" onclick="document.getElementById('avatar-input').click()">
            <img id="avatar-img" src="" alt="avatar">
            <div id="avatar-placeholder" class="avatar-placeholder">+ Photo</div>
          </div>
        </div>

        <div class="profile-info-box align-left" id="profile-info-box">
          <div class="profile-name editable placeholder-active" contenteditable="true" data-placeholder="Nome / Titolo...">Nome / Titolo...</div>
          <div class="profile-tag editable placeholder-active" contenteditable="true" data-placeholder="@username • info / status">@username • info / status</div>
          <div class="profile-bio editable placeholder-active" contenteditable="true" data-placeholder="☆°• scrivi la tua bio o descrizione qui... •°☆">☆°• scrivi la tua bio o descrizione qui... •°☆</div>
        </div>
      </div>

      <div class="color-sub-menu">
        <button class="menu-btn" onclick="openCustomPicker('bg')">Card BG</button>
        <button class="menu-btn" onclick="openCustomPicker('line')">Borders</button>
        <button class="menu-btn" onclick="openCustomPicker('banner')">Banner BG</button>
        <button class="menu-btn" onclick="openCustomPicker('text')">Text</button>
      </div>

      <input type="file" id="banner-input" style="display:none;" accept="image/*" onchange="loadPhoto(event, 'banner')">
      <input type="file" id="avatar-input" style="display:none;" accept="image/*" onchange="loadPhoto(event, 'avatar')">
      <div class="btn-download" onclick="downloadCard()">Download</div>
    </div>
  </div>

  <script>
    let currentTarget = 'bg';
    let selectedColor = '#FFFFFF';

    function openCustomPicker(target) {
      currentTarget = target;
      document.getElementById('picker-modal').style.display = 'flex';
    }

    // Funzione applica colore
    function applyPickerColor() {
      const card = document.getElementById('main-card');
      const banner = document.getElementById('banner-box');
      
      if (currentTarget === 'bg') card.style.backgroundColor = selectedColor;
      else if (currentTarget === 'line') {
        card.style.borderColor = selectedColor;
        banner.style.borderColor = selectedColor;
        document.getElementById('avatar-box').style.borderColor = selectedColor;
        // Se il banner è vuoto, segue il colore del bordo
        if (banner.style.backgroundImage === '' || banner.querySelector('img').style.display === 'none') {
           banner.style.backgroundColor = selectedColor;
        }
      }
      else if (currentTarget === 'banner') banner.style.backgroundColor = selectedColor;
      else if (currentTarget === 'text') card.querySelectorAll('.editable').forEach(el => el.style.color = selectedColor);
      
      document.getElementById('picker-modal').style.display = 'none';
    }

    function loadPhoto(e, type) {
      const file = e.target.files[0];
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById(type + '-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById(type + '-placeholder').style.display = 'none';
        if(type === 'banner') document.getElementById('banner-box').style.backgroundColor = 'transparent';
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
