<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Banner Card</title>
  <style>
    /* ... (tutto il resto del CSS rimane uguale fino a qui) ... */

    /* CORREZIONE: Banner Image Cover e Trasparenza */
    .banner-box img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Cambiato da contain a cover */
      object-position: center;
      display: none;
      position: relative;
      z-index: 2;
    }
    
    .banner-box {
      /* ... */
      background-color: transparent !important; /* Forza trasparenza */
    }

    /* CORREZIONE: Avatar Trasparenza */
    .avatar-box {
      /* ... */
      background-color: transparent !important; /* Rimosso sfondo bianco/nero */
      box-shadow: none; /* Rimosso shadow per evitare aloni */
    }

    .avatar-box img {
      /* ... */
      object-fit: cover; /* Assicura che riempia il cerchio correttamente */
    }

    /* ... resto del CSS ... */
  </style>
</head>
<body>
  <!-- ... (il resto della struttura HTML rimane invariata) ... -->
  
  <script>
    /* ... (funzioni esistenti) ... */

    // Modifica alla funzione di download per essere certi che il canvas mantenga la trasparenza
    function downloadCard() {
      const card = document.getElementById('main-card');
      
      // ... (gestione segnaposto esistente) ...

      html2canvas(card, { 
        scale: 4,
        backgroundColor: null, // Fondamentale per la trasparenza del file PNG
        useCORS: true,
        allowTaint: true
      }).then(canvas => {
        // ... (ripristino segnaposto) ...
        
        const link = document.createElement('a');
        link.download = 'banner-card.png';
        link.href = canvas.toDataURL('image/png', 1.0);
        link.click();
      });
    }
  </script>
</body>
</html>
