<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Pocket Review - Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-text-size-adjust: 100%;
    }

    html, body { 
      width: 100vw; 
      height: 100dvh; 
      overflow: hidden; 
      background-color: #ffffff; 
      color: #000000;
      font-family: 'Quicksand', sans-serif; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
    }

    .phone-wrapper { 
      width: 100vw; 
      height: 100dvh; 
      background-color: #ffffff; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
    }

    @media (min-width: 500px) { 
      .phone-wrapper { 
        width: 380px; 
        height: 780px; 
        max-height: 92vh; 
        border-radius: 40px; 
        border: 8px solid #000000; 
        box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
      } 
    }

    .main-ui { 
      display: flex; 
      width: 100%; 
      height: 100%; 
      flex-direction: column; 
      padding: 20px; 
      justify-content: space-between; 
      align-items: center; 
      background-color: #ffffff;
    }

    .card-canvas-area { 
      width: 100%; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      gap: 15px; 
      position: relative;
    }

    /* CARD BASE STILE PROFILO */
    .card { 
      width: 320px; 
      height: 180px; 
      background-color: #ffffff; 
      border: 3px solid #000000; 
      border-radius: 20px; 
      padding: 12px; 
      display: flex; 
      gap: 12px; 
      align-items: center;
      box-sizing: border-box;
    }

    /* CONTENITORE FOTO CORRETTO (SENZA SGRANATURE) */
    .card-photo-box { 
      height: 100%; 
      max-height: 156px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer; 
      flex-shrink: 0;
    }
    
    .placeholder-box { 
      width: 100px; 
      height: 156px; 
      border: 2px dashed inherit; 
      border-radius: 12px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      background-color: rgba(0,0,0,0.05); 
      font-size: 12px; 
      font-weight: 700; 
    }
    
    .card-photo-box img { 
      max-height: 156px; 
      max-width: 140px;
      width: auto;
      height: auto;
      border: 2px dashed inherit; 
      border-radius: 12px; 
      display: block;
    }
    
    .card-info-box { 
      flex: 1; 
      height: 156px; 
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      overflow: hidden; 
      gap: 4px; 
      margin-left: 4px;
    }

    .editable { outline: none; -webkit-tap-highlight-color: transparent; }
    .editable.placeholder-active { opacity: 0.6; }

    .card-title { font-size: 16px; line-height: 20px; font-weight: 800; word-break: break-word; }
    .card-voto { font-size: 13px; line-height: 16px; font-weight: 800; }
    .card-review { font-size: 11px; line-height: 14px; word-break: break-word; }

    .btn-download { 
      width: 100%; 
      background-color: #000000; 
      color: #ffffff; 
      padding: 14px; 
      border-radius: 12px; 
      font-weight: 800; 
      text-align: center; 
      margin-bottom: 10px; 
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div class="main-ui" id="main-ui">
      <div style="font-weight:800; margin-top:10px; font-size: 1.2rem;">Profile Card</div>
      
      <div class="card-canvas-area">
        <div class="card" id="main-card">
          <div class="card-photo-box" onclick="document.getElementById('file-input').click()">
            <div id="placeholder" class="placeholder-box">+ Photo</div>
            <img id="card-photo-img" style="display:none;" alt="Photo">
          </div>
          <div class="card-info-box">
            <div class="card-title editable placeholder-active" contenteditable="true" data-placeholder="Name / Role...">Name / Role...</div>
            <div class="card-voto editable placeholder-active" contenteditable="true" data-placeholder="Title / Status...">Title / Status...</div>
            <div class="card-review editable placeholder-active" contenteditable="true" data-placeholder="Bio / Details...">Bio / Details...</div>
          </div>
        </div>
      </div>

      <input type="file" id="file-input" style="display:none;" accept="image/*" onchange="loadPhoto(event)">
      <div class="btn-download" onclick="downloadCard()">Download Card</div>
    </div>
  </div>

  <script>
    // Gestione placeholder interattivi
    document.querySelectorAll('.editable').forEach(el => {
      el.addEventListener('focus', function() {
        const ph = this.getAttribute('data-placeholder');
        if (this.innerText.trim() === ph) {
          setTimeout(() => {
            const range = document.createRange();
            range.selectNodeContents(this);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          }, 0);
        }
      });

      el.addEventListener('input', function() {
        const ph = this.getAttribute('data-placeholder');
        const text = this.innerText.trim();
        if (text !== '' && text !== ph) {
          this.classList.remove('placeholder-active');
        } else {
          this.classList.add('placeholder-active');
        }
      });

      el.addEventListener('blur', function() {
        const ph = this.getAttribute('data-placeholder');
        const text = this.innerText.trim();
        if (text === '' || text === ph) {
          this.innerText = ph;
          this.classList.add('placeholder-active');
        } else {
          this.classList.remove('placeholder-active');
        }
      });
    });

    // Caricamento pulito della foto senza sgranature o distorsioni
    function loadPhoto(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(event) {
        const img = document.getElementById('card-photo-img');
        img.src = event.target.result;
        img.style.display = 'block';
        document.getElementById('placeholder').style.display = 'none';
      }
      reader.readAsDataURL(file);
    }

    // Esportazione pulita con html2canvas
    function downloadCard() {
      const card = document.getElementById('main-card');
      const editables = card.querySelectorAll('.editable');
      
      editables.forEach(el => {
        if (el.classList.contains('placeholder-active')) {
          el.dataset.wasPlaceholder = "true";
          el.style.display = 'none';
          el.innerText = '';
        }
      });

      html2canvas(card, { scale: 3, backgroundColor: null, useCORS: true }).then(canvas => {
        editables.forEach(el => {
          if (el.dataset.wasPlaceholder) {
            el.innerText = el.getAttribute('data-placeholder');
            el.style.display = '';
            delete el.dataset.wasPlaceholder;
          }
        });

        const link = document.createElement('a');
        link.download = 'profile-card.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
