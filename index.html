<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PocketMe</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body { 
      width: 100%; 
      height: 100%; 
      background-color: #ffffff; 
      font-family: 'Quicksand', sans-serif; 
      overflow: hidden;
      display: flex;
      justify-content: center;
    }

    /* Forza il contenitore a stare nello spazio visibile reale */
    .phone-wrapper { 
      width: 100%; 
      max-width: 400px;
      height: 100vh;
      height: calc(var(--vh, 1vh) * 100);
      display: flex; 
      flex-direction: column; 
      padding: 10px;
      gap: 10px;
    }

    .profile-canvas-area { 
      flex: 1;
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 0; /* Importante per il flex */
    }

    .profile-card { 
      width: 100%; 
      max-width: 320px;
      aspect-ratio: 320 / 420;
      background-color: #ffffff; 
      border: 3px solid #000000; 
      border-radius: 24px; 
      overflow: hidden;
      display: flex; 
      flex-direction: column;
      flex-shrink: 0;
    }

    .profile-banner {
      width: 100%;
      height: 30%;
      background-color: #f0f0f0;
      border-bottom: 3px solid inherit;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .banner-placeholder { font-size: 11px; font-weight: 700; color: #666666; }
    .profile-banner img { width: 100%; height: 100%; object-fit: cover; display: none; }

    .profile-avatar-container {
      position: relative;
      margin-top: -40px;
      padding: 0 20px;
      display: flex;
      width: 100%;
    }

    .profile-avatar-container.align-left { justify-content: flex-start; }
    .profile-avatar-container.align-center { justify-content: center; }
    .profile-avatar-container.align-right { justify-content: flex-end; }

    .avatar-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid #000000;
      background-color: #ffffff;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; cursor: pointer; flex-shrink: 0;
    }

    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .avatar-placeholder { font-size: 10px; font-weight: 700; color: #666666; }

    .profile-info-box {
      flex: 1;
      padding: 15px 20px;
      display: flex; flex-direction: column; gap: 6px;
      overflow: hidden;
    }

    .editable { outline: none; }
    .placeholder-active { opacity: 0.6; }
    .profile-name { font-size: 18px; font-weight: 800; color: #000000; }
    .profile-bio { font-size: 12px; font-weight: 600; color: #333333; }

    .color-sub-menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      max-width: 320px;
      margin: 0 auto;
    }

    .menu-btn {
      background: #000000;
      color: #ffffff;
      border: none;
      padding: 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-download { 
      width: 100%; 
      max-width: 320px;
      background-color: #000000; 
      color: #ffffff; 
      padding: 15px; 
      border-radius: 12px; 
      font-weight: 800; 
      text-align: center; 
      margin: 0 auto 10px auto;
      cursor: pointer; 
    }
  </style>
</head>
<body>

  <div class="phone-wrapper">
    <div class="profile-canvas-area">
      <div class="profile-card" id="main-profile">
        <div class="profile-banner" id="banner-box" onclick="document.getElementById('banner-file-input').click()">
          <div id="banner-placeholder" class="banner-placeholder">+ Banner</div>
          <img id="banner-img" alt="Banner">
        </div>
        <div class="profile-avatar-container align-center" id="avatar-align-container">
          <div class="avatar-circle" onclick="event.stopPropagation(); document.getElementById('avatar-file-input').click()">
            <div id="avatar-placeholder" class="avatar-placeholder">+ Photo</div>
            <img id="avatar-img" alt="Avatar">
          </div>
        </div>
        <div class="profile-info-box">
          <div class="profile-name editable placeholder-active" contenteditable="true" data-placeholder="Your Name...">Your Name...</div>
          <div class="profile-bio editable placeholder-active" contenteditable="true" data-placeholder="Write your bio...">Write your bio...</div>
        </div>
      </div>
    </div>

    <div class="color-sub-menu">
      <button class="menu-btn" onclick="openCustomPicker('bg')">Card Color</button>
      <button class="menu-btn" onclick="openCustomPicker('line')">Borders</button>
      <button class="menu-btn" onclick="openCustomPicker('text')">Text Color</button>
      <button class="menu-btn" onclick="cycleAvatarAlignment()">Align Photo</button>
    </div>

    <div class="btn-download" onclick="downloadProfile()">Download Profile</div>
  </div>

  <input type="file" id="banner-file-input" style="display:none;" accept="image/*" onchange="loadBanner(event)">
  <input type="file" id="avatar-file-input" style="display:none;" accept="image/*" onchange="loadAvatar(event)">

  <!-- (Il resto della logica JavaScript, dei selettori colore e di download rimane invariato rispetto alla versione precedente) -->
  
  <script>
    // Fix altezza mobile
    function setVH() { let vh = window.innerHeight * 0.01; document.documentElement.style.setProperty('--vh', `${vh}px`); }
    window.addEventListener('resize', setVH); setVH();

    // ... Inserisci qui le funzioni loadBanner, loadAvatar, cycleAvatarAlignment, openCustomPicker, downloadProfile etc. dal codice precedente ...
  </script>
</body>
</html>
